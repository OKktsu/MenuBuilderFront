<div class="p-6 max-w-2xl mx-auto">

  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-slate-900">Configurações da Empresa</h1>
    <p class="mt-1 text-sm text-slate-500">Gerencie o nome, logo e o código de convite da sua empresa.</p>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="flex items-center justify-center py-20">
    <svg class="animate-spin h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
    </svg>
  </div>

  <ng-container *ngIf="!loading">

    <!-- Invite Code Card -->
    <div class="mb-8 rounded-2xl border border-slate-200 bg-slate-50 p-5">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-xs font-semibold uppercase tracking-widest text-slate-500">Código de Convite</p>
          <p class="mt-1 text-2xl font-mono font-bold tracking-widest text-slate-800">
            {{ empresa?.codigoConvite }}
          </p>
          <p class="mt-1 text-xs text-slate-400">Compartilhe este código para convidar funcionários.</p>
        </div>
        <button
          (click)="copiarCodigo()"
          class="flex shrink-0 items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold transition-all"
          [ngClass]="copiado
            ? 'bg-green-100 text-green-700'
            : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!copiado" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            <path *ngIf="copiado" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5 13l4 4L19 7"/>
          </svg>
          {{ copiado ? 'Copiado!' : 'Copiar' }}
        </button>
      </div>
    </div>

    <!-- Edit Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="rounded-2xl border border-slate-200 bg-white p-6 space-y-6">

      <!-- Logo -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-3">Logo da Empresa</label>
        <div class="flex items-center gap-5">
          <!-- Preview -->
          <div class="h-20 w-20 shrink-0 overflow-hidden rounded-xl border border-slate-200 bg-slate-100 flex items-center justify-center">
            <img *ngIf="logoPreview" [src]="logoPreview" alt="Logo" class="h-full w-full object-cover"/>
            <svg *ngIf="!logoPreview" class="h-8 w-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M19 21H5a2 2 0 01-2-2V7l4-4h10a2 2 0 012 2v14a2 2 0 01-2 2z
                   M9 21V12h6v9"/>
            </svg>
          </div>
          <!-- Upload button -->
          <label class="cursor-pointer rounded-xl border border-dashed border-slate-300 px-5 py-3 text-sm text-slate-600 hover:bg-slate-50 transition-colors">
            <span>Escolher imagem</span>
            <input type="file" accept="image/*" class="hidden" (change)="onLogoChange($event)"/>
          </label>
        </div>
      </div>

      <!-- Nome -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2" for="nome">Nome da Empresa</label>
        <input
          id="nome"
          formControlName="nome"
          type="text"
          placeholder="A Cozinha Gourmet"
          class="block w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 shadow-sm transition-all focus:border-primary focus:ring-2 focus:ring-primary/20 sm:text-sm"/>
        <p *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched"
           class="mt-1 text-xs text-red-500">O nome é obrigatório.</p>
      </div>

      <!-- Submit -->
      <div class="flex justify-end pt-2">
        <button
          type="submit"
          [disabled]="form.invalid || saving"
          class="flex items-center gap-2 rounded-xl bg-primary px-6 py-3 text-sm font-bold text-white shadow-sm hover:bg-red-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          <svg *ngIf="saving" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
          {{ saving ? 'Salvando...' : 'Salvar alterações' }}
        </button>
      </div>

    </form>

  </ng-container>

</div>
