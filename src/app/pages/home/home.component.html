<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10 shadow-sm">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center text-white">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M10.5 6a7.5 7.5 0 107.5 7.5h-7.5V6z" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M13.5 10.5H21A7.5 7.5 0 0013.5 3v7.5z" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>
    <h1 class="text-base font-bold text-slate-800 uppercase tracking-wider">Meus Cardápios</h1>
  </div>
  <div class="flex items-center gap-4">
    <button routerLink="/builder/new" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold rounded-lg transition-all shadow-md flex items-center gap-2 uppercase tracking-wide">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      Novo Menu
    </button>
  </div>
</header>

<app-loading-spinner *ngIf="loading" message="Buscando menus..."></app-loading-spinner>

<main class="p-8 max-w-7xl mx-auto space-y-10 anim-fade-in font-sans">

  <!-- Empty State -->
  <section *ngIf="!loading && menus.length === 0" class="flex flex-col items-center justify-center py-24 text-center">
    <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center text-slate-300 mb-6">
      <svg class="h-10 w-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 7.5h.008v.008H12V7.5zM12 11.25V17m0-11.25a9 9 0 110 18 9 9 0 010-18z" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>
    <h2 class="text-xl font-bold text-slate-800">Nenhum menu cadastrado</h2>
    <p class="mt-2 text-sm text-slate-500 max-w-sm">Você ainda não criou nenhum cardápio digital. Comece agora para organizar seus pratos e categorias.</p>
    <button routerLink="/builder/new" class="mt-8 px-8 py-3 bg-brand-500 hover:bg-brand-600 text-white text-sm font-bold rounded-xl shadow-lg transition-all transform active:scale-95">
      Criar meu primeiro Menu
    </button>
  </section>

  <!-- Menus Grid -->
  <div *ngIf="!loading && menus.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let menu of menus" 
         [routerLink]="['/builder', menu.id]"
         class="group bg-white rounded-2xl border border-slate-200 p-6 hover:border-brand-500 hover:shadow-xl transition-all cursor-pointer relative overflow-hidden">
      
      <div class="absolute top-0 right-0 p-4 opacity-0 group-hover:opacity-100 transition-opacity">
        <div class="w-8 h-8 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

      <div class="flex flex-col h-full">
        <h3 class="text-lg font-bold text-slate-800 group-hover:text-brand-600 transition-colors">{{ menu.restaurantName }}</h3>
        <p class="text-xs text-slate-400 font-medium uppercase mt-1">{{ menu.openingHours || 'Configurar Horários' }}</p>
        <p class="text-sm text-slate-500 mt-4 line-clamp-2">{{ menu.description || 'Nenhuma descrição informada.' }}</p>
        
        <div class="mt-auto pt-6 flex items-center justify-between">
          <span class="text-[10px] font-black text-slate-400 bg-slate-50 px-2 py-1 rounded uppercase tracking-tighter">Ativo</span>
          <div class="flex -space-x-2">
            <div *ngFor="let i of [1,2,3]" class="w-6 h-6 rounded-full border-2 border-white bg-slate-200"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>
