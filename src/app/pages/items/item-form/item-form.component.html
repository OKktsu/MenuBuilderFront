<app-loading-spinner *ngIf="loading" [message]="isEditMode ? 'Salvando alterações...' : 'Cadastrando novo item...'"></app-loading-spinner>

<div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
  <!-- Header -->
  <header class="mb-10 flex items-center justify-between">
    <div>
      <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Cadastrar Novo Item</h2>
      <p class="mt-1 text-sm text-slate-500">Adicione um novo prato ou bebida ao seu cardápio digital.</p>
    </div>
    <button routerLink="/menus" class="text-sm font-medium text-slate-500 hover:text-slate-700 flex items-center gap-1 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
      Voltar para Lista
    </button>
  </header>

  <form (ngSubmit)="onSubmit()" #itemForm="ngForm" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Left Column: Basic Info & Tags -->
    <div class="lg:col-span-2 space-y-8">
      <!-- Basic Info Section -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 bg-slate-50/50">
          <h3 class="text-lg font-bold text-slate-800">Informações Básicas</h3>
        </div>
        <div class="p-6 space-y-6">
          <div>
            <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">Nome do Item</label>
            <input type="text" id="name" name="name" [(ngModel)]="item.name" required
                   class="block w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-accent focus:border-brand-accent transition-all placeholder:text-slate-400"
                   placeholder="Ex: Hambúrguer Artesanal Wagyu">
          </div>

          <div>
            <label for="description" class="block text-sm font-semibold text-slate-700 mb-2">Descrição</label>
            <textarea id="description" name="description" [(ngModel)]="item.description" rows="3"
                      class="block w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-accent focus:border-brand-accent transition-all placeholder:text-slate-400"
                      placeholder="Descreva o prato de forma atrativa..."></textarea>
          </div>

          <div>
            <label for="ingredients" class="block text-sm font-semibold text-slate-700 mb-2">Itens / Ingredientes</label>
            <textarea id="ingredients" name="ingredients" [(ngModel)]="item.ingredients" rows="3"
                      class="block w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-accent focus:border-brand-accent transition-all placeholder:text-slate-400"
                      placeholder="Liste os principais ingredientes e acompanhamentos..."></textarea>
          </div>
        </div>
      </section>

      <!-- Dietary Restriction Tags (Now Dynamic) -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 bg-slate-50/50">
          <h3 class="text-lg font-bold text-slate-800">Tags e Restrições</h3>
        </div>
        <div class="p-6 space-y-4">
          <div>
            <label for="tag-input" class="block text-sm font-semibold text-slate-700 mb-2">Adicionar Tag</label>
            <div class="relative">
              <input type="text" id="tag-input"
                     (keydown.enter)="$event.preventDefault(); addTag($event)"
                     placeholder="Digite uma tag e aperte Enter..."
                     class="block w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-accent focus:border-brand-accent transition-all placeholder:text-slate-400">
              <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                <span class="text-xs text-slate-400">Pressione Enter</span>
              </div>
            </div>
          </div>

          <!-- Chip Container -->
          <div class="flex flex-wrap gap-2 min-h-[40px] p-4 bg-slate-50 rounded-xl border border-dashed border-slate-200">
            <span *ngFor="let tag of item.tags"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold bg-brand-50 text-brand-700 border border-brand-100 group shadow-sm transition-all hover:bg-brand-100">
              {{ tag }}
              <button type="button" (click)="removeTag(tag)" class="text-brand-400 hover:text-brand-600 focus:outline-none transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
                </svg>
              </button>
            </span>
            <span *ngIf="!item.tags || item.tags.length === 0" class="text-sm text-slate-400 italic py-1">Nenhuma tag adicionada. Digite acima e aperte Enter.</span>
          </div>
        </div>
      </section>
    </div>

    <!-- Right Column: Settings & Actions -->
    <div class="space-y-8">
      <!-- Pricing -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 bg-slate-50/50">
          <h3 class="text-lg font-bold text-slate-800">Preço</h3>
        </div>
        <div class="p-6 space-y-6">
          <div>
            <label for="price" class="block text-sm font-semibold text-slate-700 mb-2">Preço de Venda</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="text-slate-400 font-bold">R$</span>
              </div>
              <input type="number" id="price" name="price" [(ngModel)]="item.price"
                     class="block w-full pl-12 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-accent focus:border-brand-accent transition-all"
                     placeholder="0,00">
            </div>
          </div>
        </div>
      </section>

      <!-- Image -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 bg-slate-50/50">
          <h3 class="text-lg font-bold text-slate-800">Mídia</h3>
        </div>
        <div class="p-6 space-y-6">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Imagem do Produto</label>
            <div class="relative group">
              <input type="file" id="file-upload" class="hidden" (change)="onFileSelected($event)" accept="image/*">
              <label for="file-upload" 
                     class="flex flex-col items-center justify-center w-full min-h-[160px] p-6 border-2 border-dashed border-slate-200 rounded-2xl cursor-pointer bg-slate-50 hover:bg-slate-100 hover:border-brand-accent transition-all animate-in fade-in zoom-in duration-300 overflow-hidden relative">
                
                <!-- Not Selected State -->
                <ng-container *ngIf="!item.imagePath">
                  <div class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none">
                    <img src="assets/placeholder.png" class="w-full h-full object-cover">
                  </div>
                  <div class="relative z-10 flex flex-col items-center">
                    <div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center text-slate-400 group-hover:text-brand-accent transition-colors mb-3">
                      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
                      </svg>
                    </div>
                    <div class="text-center">
                      <p class="text-sm font-bold text-slate-700">Clique para enviar</p>
                      <p class="text-xs text-slate-400 mt-1">PNG, JPG ou WEBP (Max. 2MB)</p>
                    </div>
                  </div>
                </ng-container>

                <!-- Selected Preview State -->
                <ng-container *ngIf="item.imagePath">
                  <img [src]="item.imagePath" class="absolute inset-0 w-full h-full object-cover opacity-20 group-hover:opacity-40 transition-opacity">
                  <div class="relative z-10 flex flex-col items-center">
                    <div class="w-10 h-10 bg-brand-accent text-white rounded-full flex items-center justify-center shadow-lg mb-2">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
                      </svg>
                    </div>
                    <p class="text-sm font-extrabold text-slate-800">Foto Carregada!</p>
                    <p class="text-xs text-brand-600 font-bold mt-1">Clique para alterar</p>
                  </div>
                </ng-container>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- Actions -->
      <div class="flex flex-col gap-3 pt-6">
        <button type="submit"
                class="w-full px-6 py-4 bg-brand-accent hover:bg-red-700 text-white text-sm font-bold rounded-xl shadow-lg shadow-red-200 transition-all transform hover:scale-[1.02] active:scale-95 disabled:opacity-50 disabled:scale-100"
                [disabled]="!itemForm.valid">
          Salvar Item
        </button>
        <button type="button" routerLink="/menus"
                class="w-full px-6 py-4 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 bg-white hover:bg-slate-50 focus:outline-none transition-all">
          Cancelar
        </button>
      </div>
    </div>
  </form>
</div>
