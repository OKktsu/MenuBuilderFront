<div *ngIf="isOpen" 
     class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6"
     aria-labelledby="modal-title" role="dialog" aria-modal="true">
  
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity animate-in fade-in duration-300" 
       (click)="onCancel()" aria-hidden="true"></div>

  <!-- Modal Card -->
  <div class="relative z-10 bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden transform transition-all animate-in zoom-in slide-in-from-bottom-4 duration-300">
    <div class="p-8">
      <div class="flex items-center justify-center w-16 h-16 rounded-2xl mb-6 mx-auto"
           [ngClass]="type === 'danger' ? 'bg-red-50 text-red-500' : 'bg-blue-50 text-blue-500'">
        <svg *ngIf="type === 'danger'" class="w-8 h-8 font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
        </svg>
        <svg *ngIf="type === 'info'" class="w-8 h-8 font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
        </svg>
      </div>

      <div class="text-center mb-8">
        <h3 class="text-2xl font-black text-slate-900 mb-3" id="modal-title">{{ title }}</h3>
        <p class="text-slate-500 font-medium leading-relaxed px-4">{{ message }}</p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <button (click)="onCancel()"
                type="button" 
                class="flex-1 px-6 py-4 rounded-2xl text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-all active:scale-95">
          {{ cancelText }}
        </button>
        <button (click)="onConfirm()"
                type="button" 
                class="flex-1 px-6 py-4 rounded-2xl text-sm font-bold text-white transition-all shadow-lg active:scale-95"
                [ngClass]="type === 'danger' ? 'bg-red-500 hover:bg-red-600 shadow-red-200' : 'bg-brand-accent hover:bg-brand-600 shadow-brand-100'">
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
</div>
